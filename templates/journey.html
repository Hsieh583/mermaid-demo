<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>使用者旅程範例 - Mermaid Demo</title>
    <link rel="stylesheet" href="template.css">
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
</head>
<body>
    <header class="header">
        <h1>🚶 使用者旅程 (User Journey)</h1>
        <a href="../index.html" class="nav-link">← 返回首頁</a>
    </header>

    <div class="main-container">
        <div class="description">
            <p>使用者旅程圖用於描述使用者體驗流程。適合分析用戶行為、優化體驗、規劃服務流程等。</p>
        </div>

        <div class="controls">
            <button id="update-btn" class="btn btn-primary">🔄 更新預覽</button>
            <button id="reset-btn" class="btn btn-reset">↩️ 恢復預設</button>
        </div>

        <div class="content">
            <div class="panel">
                <h2>✏️ 編輯語法</h2>
                <div class="editor-container">
                    <textarea id="code-editor" spellcheck="false"></textarea>
                </div>
            </div>

            <div class="panel">
                <h2>👀 即時預覽</h2>
                <div class="preview-container">
                    <div id="preview"></div>
                    <div id="error-message" class="error-message" style="display: none;"></div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>© 2024 Mermaid Demo | 使用 <a href="https://mermaid.js.org/" target="_blank">Mermaid.js</a> 建立</p>
    </footer>

    <script src="template.js"></script>
    <script>
        const defaultCode = `journey
    title 線上購物使用者體驗旅程
    section 發現階段
      瀏覽網站: 5: 使用者
      搜尋商品: 4: 使用者
      查看商品詳情: 5: 使用者
    section 評估階段
      比較價格: 3: 使用者
      閱讀評論: 4: 使用者
      檢查庫存: 5: 使用者
    section 購買階段
      加入購物車: 5: 使用者
      填寫配送資訊: 3: 使用者
      選擇付款方式: 4: 使用者
      確認訂單: 4: 使用者
    section 配送階段
      等待出貨: 3: 使用者
      追蹤物流: 4: 使用者
      收到商品: 5: 使用者
    section 售後階段
      檢查商品: 5: 使用者
      撰寫評論: 4: 使用者`;
        
        init(defaultCode);
    </script>
</body>
</html>
