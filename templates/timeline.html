<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>時間軸範例 - Mermaid Demo</title>
    <link rel="stylesheet" href="template.css">
    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
        window.mermaid = mermaid;
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
</head>
<body>
    <header class="header">
        <h1>⏳ 時間軸 (Timeline)</h1>
        <a href="../index.html" class="nav-link">← 返回首頁</a>
    </header>

    <div class="main-container">
        <div class="description">
            <p>時間軸圖用於展示事件發展歷程。適合呈現公司發展史、專案里程碑、產品演進等。</p>
        </div>

        <div class="controls">
            <button id="update-btn" class="btn btn-primary">🔄 更新預覽</button>
            <button id="reset-btn" class="btn btn-reset">↩️ 恢復預設</button>
        </div>

        <div class="content">
            <div class="panel">
                <h2>✏️ 編輯語法</h2>
                <div class="editor-container">
                    <textarea id="code-editor" spellcheck="false"></textarea>
                </div>
            </div>

            <div class="panel">
                <h2>👀 即時預覽</h2>
                <div class="preview-container">
                    <div id="preview"></div>
                    <div id="error-message" class="error-message" style="display: none;"></div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>© 2024 Mermaid Demo | 使用 <a href="https://mermaid.js.org/" target="_blank">Mermaid.js</a> 建立</p>
    </footer>

    <script src="template.js"></script>
    <script>
        const defaultCode = `timeline
    title 公司發展里程碑
    section 2020 創立期
        2020-01 : 公司成立
               : 初始團隊 5 人
        2020-06 : 完成種子輪融資
               : 開發第一版產品
    section 2021 成長期
        2021-03 : 產品正式上線
               : 獲得首批 100 位用戶
        2021-09 : 完成 A 輪融資
               : 團隊擴展至 20 人
        2021-12 : 用戶突破 10,000 人
    section 2022 擴張期
        2022-04 : 開拓國際市場
               : 設立海外辦公室
        2022-08 : 推出企業版服務
               : 完成 B 輪融資
        2022-12 : 年度營收達標
               : 團隊成長至 50 人
    section 2023 穩定期
        2023-06 : 用戶突破 100,000 人
               : 獲得產業獎項
        2023-12 : 實現獲利
               : 規劃 IPO`;
        
        init(defaultCode);
    </script>
</body>
</html>
