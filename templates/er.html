<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>實體關係圖範例 - Mermaid Demo</title>
    <link rel="stylesheet" href="template.css">
    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
        window.mermaid = mermaid;
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
</head>
<body>
    <header class="header">
        <h1>🗄️ 實體關係圖 (ER Diagram)</h1>
        <a href="../index.html" class="nav-link">← 返回首頁</a>
    </header>

    <div class="main-container">
        <div class="description">
            <p>實體關係圖用於展示資料庫結構關係。適合描述資料表之間的關聯、資料庫設計、數據模型等。</p>
        </div>

        <div class="controls">
            <button id="update-btn" class="btn btn-primary">🔄 更新預覽</button>
            <button id="reset-btn" class="btn btn-reset">↩️ 恢復預設</button>
        </div>

        <div class="content">
            <div class="panel">
                <h2>✏️ 編輯語法</h2>
                <div class="editor-container">
                    <textarea id="code-editor" spellcheck="false"></textarea>
                </div>
            </div>

            <div class="panel">
                <h2>👀 即時預覽</h2>
                <div class="preview-container">
                    <div id="preview"></div>
                    <div id="error-message" class="error-message" style="display: none;"></div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>© 2024 Mermaid Demo | 使用 <a href="https://mermaid.js.org/" target="_blank">Mermaid.js</a> 建立</p>
    </footer>

    <script src="template.js"></script>
    <script>
        const defaultCode = `erDiagram
    CUSTOMER ||--o{ ORDER : places
    CUSTOMER {
        string customer_id PK
        string name
        string email
        string phone
    }
    
    ORDER ||--|{ ORDER_ITEM : contains
    ORDER {
        string order_id PK
        string customer_id FK
        date order_date
        float total_amount
        string status
    }
    
    ORDER_ITEM }o--|| PRODUCT : references
    ORDER_ITEM {
        string order_item_id PK
        string order_id FK
        string product_id FK
        int quantity
        float price
    }
    
    PRODUCT {
        string product_id PK
        string name
        string description
        float price
        int stock
        string category
    }
    
    PRODUCT }o--|| CATEGORY : belongs_to
    CATEGORY {
        string category_id PK
        string name
        string description
    }`;
        
        init(defaultCode);
    </script>
</body>
</html>
