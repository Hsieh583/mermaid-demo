<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Git 圖範例 - Mermaid Demo</title>
    <link rel="stylesheet" href="template.css">
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
</head>
<body>
    <header class="header">
        <h1>🌿 Git 圖 (Git Graph)</h1>
        <a href="../index.html" class="nav-link">← 返回首頁</a>
    </header>

    <div class="main-container">
        <div class="description">
            <p>Git 圖用於視覺化版本控制流程。適合展示分支策略、合併流程、版本發布等。</p>
        </div>

        <div class="controls">
            <button id="update-btn" class="btn btn-primary">🔄 更新預覽</button>
            <button id="reset-btn" class="btn btn-reset">↩️ 恢復預設</button>
        </div>

        <div class="content">
            <div class="panel">
                <h2>✏️ 編輯語法</h2>
                <div class="editor-container">
                    <textarea id="code-editor" spellcheck="false"></textarea>
                </div>
            </div>

            <div class="panel">
                <h2>👀 即時預覽</h2>
                <div class="preview-container">
                    <div id="preview"></div>
                    <div id="error-message" class="error-message" style="display: none;"></div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>© 2024 Mermaid Demo | 使用 <a href="https://mermaid.js.org/" target="_blank">Mermaid.js</a> 建立</p>
    </footer>

    <script src="template.js"></script>
    <script>
        const defaultCode = `gitGraph
    commit id: "初始化專案"
    commit id: "新增基礎功能"
    
    branch develop
    checkout develop
    commit id: "開發新功能"
    
    branch feature/login
    checkout feature/login
    commit id: "實作登入頁面"
    commit id: "新增驗證邏輯"
    
    checkout develop
    merge feature/login
    commit id: "整合登入功能"
    
    branch feature/dashboard
    checkout feature/dashboard
    commit id: "建立儀表板"
    commit id: "新增圖表元件"
    
    checkout develop
    merge feature/dashboard
    
    checkout main
    merge develop tag: "v1.0.0"
    
    checkout develop
    commit id: "修復小錯誤"
    
    checkout main
    merge develop tag: "v1.0.1"`;
        
        init(defaultCode);
    </script>
</body>
</html>
