<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>類別圖範例 - Mermaid Demo</title>
    <link rel="stylesheet" href="template.css">
    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
        window.mermaid = mermaid;
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
</head>
<body>
    <header class="header">
        <h1>🏗️ 類別圖 (Class Diagram)</h1>
        <a href="../index.html" class="nav-link">← 返回首頁</a>
    </header>

    <div class="main-container">
        <div class="description">
            <p>類別圖用於展示物件導向系統的結構。適合描述類別之間的關係、繼承結構、系統架構等。</p>
        </div>

        <div class="controls">
            <button id="update-btn" class="btn btn-primary">🔄 更新預覽</button>
            <button id="reset-btn" class="btn btn-reset">↩️ 恢復預設</button>
        </div>

        <div class="content">
            <div class="panel">
                <h2>✏️ 編輯語法</h2>
                <div class="editor-container">
                    <textarea id="code-editor" spellcheck="false"></textarea>
                </div>
            </div>

            <div class="panel">
                <h2>👀 即時預覽</h2>
                <div class="preview-container">
                    <div id="preview"></div>
                    <div id="error-message" class="error-message" style="display: none;"></div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>© 2024 Mermaid Demo | 使用 <a href="https://mermaid.js.org/" target="_blank">Mermaid.js</a> 建立</p>
    </footer>

    <script src="template.js"></script>
    <script>
        const defaultCode = `classDiagram
    class User {
        -String username
        -String email
        -String password
        +login()
        +logout()
        +updateProfile()
    }
    
    class Admin {
        -String permissions
        +manageUsers()
        +viewLogs()
    }
    
    class Product {
        -String name
        -Float price
        -Integer stock
        +updatePrice()
        +checkStock()
    }
    
    class Order {
        -String orderId
        -Date orderDate
        -Float total
        +calculateTotal()
        +processPayment()
    }
    
    User <|-- Admin : 繼承
    User "1" --> "*" Order : 建立
    Order "*" --> "*" Product : 包含`;
        
        init(defaultCode);
    </script>
</body>
</html>
