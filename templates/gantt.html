<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>甘特圖範例 - Mermaid Demo</title>
    <link rel="stylesheet" href="template.css">
    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
        window.mermaid = mermaid;
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
</head>
<body>
    <header class="header">
        <h1>📅 甘特圖 (Gantt Chart)</h1>
        <a href="../index.html" class="nav-link">← 返回首頁</a>
    </header>

    <div class="main-container">
        <div class="description">
            <p>甘特圖用於專案時程規劃與追蹤。適合展示專案排程、任務分配、進度管理等。</p>
        </div>

        <div class="controls">
            <button id="update-btn" class="btn btn-primary">🔄 更新預覽</button>
            <button id="reset-btn" class="btn btn-reset">↩️ 恢復預設</button>
        </div>

        <div class="content">
            <div class="panel">
                <h2>✏️ 編輯語法</h2>
                <div class="editor-container">
                    <textarea id="code-editor" spellcheck="false"></textarea>
                </div>
            </div>

            <div class="panel">
                <h2>👀 即時預覽</h2>
                <div class="preview-container">
                    <div id="preview"></div>
                    <div id="error-message" class="error-message" style="display: none;"></div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>© 2024 Mermaid Demo | 使用 <a href="https://mermaid.js.org/" target="_blank">Mermaid.js</a> 建立</p>
    </footer>

    <script src="template.js"></script>
    <script>
        const defaultCode = `gantt
    title 網站開發專案時程
    dateFormat YYYY-MM-DD
    section 規劃階段
    需求分析           :done,    des1, 2024-01-01, 2024-01-15
    系統設計           :done,    des2, 2024-01-16, 2024-01-31
    section 開發階段
    前端開發           :active,  dev1, 2024-02-01, 45d
    後端開發           :active,  dev2, 2024-02-01, 45d
    資料庫設計         :done,    dev3, 2024-02-01, 15d
    API 整合           :         dev4, 2024-02-20, 30d
    section 測試階段
    單元測試           :         test1, 2024-03-15, 10d
    整合測試           :         test2, 2024-03-25, 10d
    使用者測試         :         test3, 2024-04-05, 7d
    section 部署上線
    準備上線環境       :         dep1, 2024-04-12, 5d
    正式上線           :crit,    dep2, 2024-04-17, 1d
    監控與維護         :         dep3, 2024-04-18, 14d`;
        
        init(defaultCode);
    </script>
</body>
</html>
