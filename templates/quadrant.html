<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>象限圖範例 - Mermaid Demo</title>
    <link rel="stylesheet" href="template.css">
    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
        window.mermaid = mermaid;
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
</head>
<body>
    <header class="header">
        <h1>📊 象限圖 (Quadrant Chart)</h1>
        <a href="../index.html" class="nav-link">← 返回首頁</a>
    </header>

    <div class="main-container">
        <div class="description">
            <p>象限圖用於四象限分析。適合優先級矩陣、風險評估、產品組合分析等。</p>
        </div>

        <div class="controls">
            <button id="update-btn" class="btn btn-primary">🔄 更新預覽</button>
            <button id="reset-btn" class="btn btn-reset">↩️ 恢復預設</button>
        </div>

        <div class="content">
            <div class="panel">
                <h2>✏️ 編輯語法</h2>
                <div class="editor-container">
                    <textarea id="code-editor" spellcheck="false"></textarea>
                </div>
            </div>

            <div class="panel">
                <h2>👀 即時預覽</h2>
                <div class="preview-container">
                    <div id="preview"></div>
                    <div id="error-message" class="error-message" style="display: none;"></div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>© 2024 Mermaid Demo | 使用 <a href="https://mermaid.js.org/" target="_blank">Mermaid.js</a> 建立</p>
    </footer>

    <script src="template.js"></script>
    <script>
        const defaultCode = `quadrantChart
    title 專案任務優先級矩陣
    x-axis 低緊急度 --> 高緊急度
    y-axis 低重要度 --> 高重要度
    quadrant-1 立即執行
    quadrant-2 計劃安排
    quadrant-3 考慮委派
    quadrant-4 可以忽略
    修復安全漏洞: [0.9, 0.95]
    客戶需求開發: [0.8, 0.85]
    系統效能優化: [0.4, 0.9]
    技術文件撰寫: [0.3, 0.7]
    處理客戶投訴: [0.85, 0.6]
    團隊會議: [0.7, 0.4]
    整理程式碼: [0.2, 0.3]
    社交媒體互動: [0.15, 0.2]`;
        
        init(defaultCode);
    </script>
</body>
</html>
